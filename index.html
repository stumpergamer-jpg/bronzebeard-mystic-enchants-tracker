<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>WoW Ascension - RE Tracker Pro v1.0.0</title>
    <style>

        @font-face {
            font-family: 'Lifecraft';
            src: url('https://db.onlinewebfonts.com/t/790327f4740e6c6052733979727f712f.woff2') format('woff2');
        }

        :root {
            --bg-dark: #0f0f0f; --card-bg: #1a1a1a; --accent: #f8b700;
            --text-main: #e0e0e0; --text-dim: #a0a0a0; --border: #333; 
            --input-bg: #222; --danger: #c41e3a; --success: #4caf50;
            --alliance: #0078ff; --horde: #8c1616;
            --font-main: 'Inter', sans-serif;
        }

        * { box-sizing: border-box; }
        body { font-family: var(--font-main); background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 10px; line-height: 1.4; overflow: hidden; }
        .container { max-width: 1250px; margin: auto; height: 100vh; display: flex; flex-direction: column; }
        
        .header-section { text-align: center; margin-bottom: 10px; flex: 0 0 auto; }
        h1 { font-family: 'Lifecraft', serif; color: var(--accent); margin: 0; font-size: 2.8rem; letter-spacing: 2px; text-shadow: 3px 3px 0px #000; font-weight: normal; }

        .top-bar { flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; background: var(--card-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
        .data-management { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .data-group { display: flex; gap: 8px; align-items: center; }
        
        label { font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-data { font-family: var(--font-main); font-weight: 600; background: #2a2a2a; border: 1px solid #444; color: #ddd; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-data:hover { border-color: var(--accent); color: var(--accent); }

        .search-wrapper { position: relative; width: 100%; }
        .search-wrapper::before {
            content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            font-size: 0.9rem; color: var(--text-dim); pointer-events: none;
        }
        #searchInput { width: 100%; padding: 10px 40px 10px 40px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: white; font-family: var(--font-main); font-size: 0.9rem; }
        #clearSearch { 
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: #333; color: #aaa; border: none; border-radius: 50%; 
            width: 20px; height: 20px; cursor: pointer; font-size: 12px; 
            display: none; align-items: center; justify-content: center; line-height: 1;
        }
        #clearSearch:hover { background: var(--danger); color: white; }

        .dropdown-group { flex: 1; position: relative; }
        .custom-select { 
            font-family: var(--font-main); background-color: var(--input-bg); border: 1px solid var(--border); 
            color: white; font-size: 0.85rem; border-radius: 6px; height: 36px; padding: 0 10px; 
            width: 100%; display: flex; align-items: center; cursor: pointer; 
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); 
            background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 8px auto;
        }
        .options-list { 
            position: absolute; top: 100%; left: 0; right: 0; background: #222; 
            border: 1px solid var(--border); z-index: 100; display: none; 
            border-radius: 6px; max-height: 250px; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .options-list.show { display: block; }
        .option-item { padding: 8px 12px; display: flex; align-items: center; cursor: pointer; font-size: 0.85rem; border-bottom: 1px solid #333; transition: 0.1s; }
        .option-item:hover { background: #333; color: var(--accent); }

        .progress-section { flex: 0 0 auto; background: var(--card-bg); padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border); display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .progress-container { display: flex; flex-direction: column; gap: 6px; }
        .progress-header { display: flex; justify-content: space-between; align-items: center; }
        .progress-label { font-size: 0.65rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; }
        .progress-text { font-size: 0.75rem; font-weight: 800; color: var(--text-main); }
        .progress-bar-bg { background: #111; height: 8px; border-radius: 4px; border: 1px solid #333; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #b8860b, var(--accent)); transition: width 0.5s; }

        .table-wrapper { flex: 1 1 auto; overflow: hidden; background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        table { width: 100%; border-collapse: collapse; display: flex; flex-direction: column; height: 100%; }
        thead { flex: 0 0 auto; background: #252525; display: table; width: 100%; table-layout: fixed; }
        tbody { flex: 1 1 auto; display: block; overflow-y: scroll; width: 100%; }
        tr { display: table; width: 100%; table-layout: fixed; }
        
        th { padding: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; border-bottom: 2px solid var(--border); text-align: left; cursor: pointer; user-select: none; }
        th:hover { background: #333; }
        .col-collect { width: 80px; text-align: center; font-size: 0.65rem; }
        
        td { padding: 8px 12px; border-bottom: 1px solid #252525; font-size: 0.85rem; }
        tr:hover td { background: #222; }
        tr.collected { opacity: 0.45; }
        
        .btn-action { width: 32px; height: 32px; border-radius: 6px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.2s; margin: auto; }
        .btn-collect { background: rgba(76, 175, 80, 0.1); color: var(--success); border: 1px solid var(--success); }
        .btn-collect:hover { background: var(--success); color: white; }
        .btn-remove { background: rgba(196, 30, 58, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-remove:hover { background: var(--danger); color: white; }

        .icon-class { width: 18px; height: 18px; border-radius: 3px; vertical-align: middle; margin-right: 8px; }
        .btn-video { font-size: 0.6rem; padding: 3px 8px; background: var(--danger); color: white; text-decoration: none; border-radius: 4px; font-weight: 800; transition: 0.2s ease; display: inline-block; }
        .btn-video:hover { background: #ff4d4d; box-shadow: 0 0 8px rgba(196, 30, 58, 0.4); transform: translateY(-1px); }

        footer { flex: 0 0 auto; margin-top: 10px; padding: 10px; text-align: center; border-top: 1px solid var(--border); color: var(--text-dim); font-size: 0.8rem; }
        .credits-link { color: var(--accent); text-decoration: none; font-weight: 600; }
        
        .faction-selector { display: flex; background: #111; padding: 3px; border-radius: 6px; border: 1px solid #333; gap: 4px; }
        .fac-btn { padding: 4px 10px; border: 1px solid transparent; background: transparent; color: #666; cursor: pointer; font-weight: bold; border-radius: 4px; transition: 0.2s; font-size: 0.7rem; display: flex; align-items: center; gap: 6px; }
        .fac-btn.active.all { background: #333; color: var(--accent); border: 1px solid var(--accent); }
        .fac-btn.active.alliance { background: var(--alliance); color: white; }
        .fac-btn.active.horde { background: var(--horde); color: white; }
        .fac-icon { width: 16px; height: 16px; object-fit: contain; }

        tbody::-webkit-scrollbar, .options-list::-webkit-scrollbar { width: 8px; }
        tbody::-webkit-scrollbar-thumb, .options-list::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>Mystic Enchants Tracker</h1>
    </div>

    <div class="top-bar">
        <div class="data-management">
            <div class="data-group">
                <label>Faction</label>
                <div class="faction-selector">
                    <button class="fac-btn all active" id="fac-both" onclick="setFaction('Both')">ALL</button>
                    <button class="fac-btn alliance" id="fac-alliance" onclick="setFaction('Alliance')">
                        <img src="https://wow.zamimg.com/images/wow/icons/medium/pvpcurrency-honor-alliance.jpg" class="fac-icon">
                    </button>
                    <button class="fac-btn horde" id="fac-horde" onclick="setFaction('Horde')">
                        <img src="https://wow.zamimg.com/images/wow/icons/medium/pvpcurrency-honor-horde.jpg" class="fac-icon">
                    </button>
                </div>
            </div>
            <div class="data-group">
                <button class="btn-data" style="color:var(--success)" onclick="bulkAction(true)">✓ Collect All</button>
                <button class="btn-data" style="color:var(--danger)" onclick="bulkAction(false)">✗ Collect None</button>
                <button class="btn-data" onclick="exportData()">💾 Save</button>
                <button class="btn-data" onclick="document.getElementById('importFile').click()">📂 Load</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
            </div>
        </div>

        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="Search with enchant name or region..." onkeyup="handleSearchInput()">
            <button id="clearSearch" onclick="clearSearch()">✕</button>
        </div>

        <div class="data-management">
            <div class="dropdown-group">
                <label>Class</label>
                <div class="custom-select" onclick="toggleDropdown(event, 'classOptions')">
                    <img src="" class="icon-class" id="classDisplayIcon" style="display:none">
                    <span id="classDisplayText">All Classes</span>
                </div>
                <div id="classOptions" class="options-list"></div>
            </div>
            <div class="dropdown-group">
                <label>Region</label>
                <div class="custom-select" onclick="toggleDropdown(event, 'regionOptions')">
                    <span id="regionDisplayText">All Regions</span>
                </div>
                <div id="regionOptions" class="options-list"></div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; padding-top:15px;">
                <input type="checkbox" id="hideCollected" onchange="renderTable()"> 
                <label for="hideCollected" style="font-size: 0.75rem; cursor:pointer;">Hide Collected</label>
            </div>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-container">
            <div class="progress-header">
                <span class="progress-label">Global Progress</span>
                <span id="globalText" class="progress-text">0/0</span>
            </div>
            <div class="progress-bar-bg"><div id="globalFill" class="progress-bar-fill"></div></div>
        </div>
        <div class="progress-container">
            <div class="progress-header">
                <span id="classProgressLabel" class="progress-label">Class Progress</span>
                <span id="classText" class="progress-text">0/0</span>
            </div>
            <div class="progress-bar-bg"><div id="classFill" class="progress-bar-fill" style="background: var(--success);"></div></div>
        </div>
        <div class="progress-container">
            <div class="progress-header">
                <span id="regionProgressLabel" class="progress-label">Region Progress</span>
                <span id="regionText" class="progress-text">0/0</span>
            </div>
            <div class="progress-bar-bg"><div id="regionFill" class="progress-bar-fill" style="background: #0078ff;"></div></div>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th class="col-collect">Collect</th>
                    <th onclick="setSort('name')">Enchant <span id="sort-name" class="sort-icon"></span></th>
                    <th onclick="setSort('class')">Class <span id="sort-class" class="sort-icon"></span></th>
                    <th style="width:100px;">Faction</th>
                    <th onclick="setSort('zone')">Location <span id="sort-zone" class="sort-icon"></span></th>
                    <th style="width: 100px; text-align:center;">Video</th>
                </tr>
            </thead>
            <tbody id="reBody"></tbody>
        </table>
    </div>

    <footer>
        <p>Version 1.0.0 • Special thanks to <a href="https://www.youtube.com/@shadowmeldgg" target="_blank" class="credits-link">shadowmeldgg</a> for the locations data</p>
    </footer>
</div>

    let collectedNames = JSON.parse(localStorage.getItem('ascension_save_v1')) || [];
    let currentClass = "all";
    let currentRegion = "all";
    let currentFaction = "Both";
    let sortKey = 'zone'; 
    let sortOrder = 1;

    function renderTable() {
        const body = document.getElementById('reBody');
        const searchInput = document.getElementById('searchInput');
        const search = searchInput ? searchInput.value.toLowerCase() : "";
        const hideChecked = document.getElementById('hideCollected').checked;

        const factionPool = enchants.filter(e => currentFaction === "Both" || e.faction === "Both" || e.faction === currentFaction);
        
        updateProgress(factionPool);
        updateSortIcons();

        let filtered = factionPool.filter(e => {
            const matchesSearch = e.name.toLowerCase().includes(search) || e.zone.toLowerCase().includes(search);
            const matchesClass = currentClass === "all" || e.class === currentClass;
            const matchesZone = currentRegion === "all" || e.zone === currentRegion;
            const isColl = collectedNames.includes(e.name.toLowerCase());
            return matchesSearch && matchesClass && matchesZone && (!hideChecked || !isColl);
        });

        filtered.sort((a, b) => {
            const isA = collectedNames.includes(a.name.toLowerCase());
            const isB = collectedNames.includes(b.name.toLowerCase());
            if (isA !== isB) return isA ? 1 : -1;
            let valA = String(a[sortKey]).toLowerCase();
            let valB = String(b[sortKey]).toLowerCase();
            if (valA < valB) return -1 * sortOrder;
            if (valA > valB) return 1 * sortOrder;
            return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
        });

        body.innerHTML = "";
        filtered.forEach(e => {
            const isColl = collectedNames.includes(e.name.toLowerCase());
            const row = document.createElement('tr');
            if (isColl) row.className = 'collected';
            row.innerHTML = `
                <td class="action-cell col-collect">
                    <button class="btn-action ${isColl ? 'btn-remove' : 'btn-collect'}" onclick="toggleRE('${e.name.toLowerCase()}', ${!isColl})">
                        ${isColl ? '✕' : '✓'}
                    </button>
                </td>
                <td style="font-weight:600">${e.name}</td>
                <td><img src="https://wow.zamimg.com/images/wow/icons/small/${classData[e.class]}.jpg" class="icon-class">${e.class}</td>
                <td style="width:100px;">${e.faction === "Both" ? `<img src="${icons.alliance}" class="fac-icon"><img src="${icons.horde}" class="fac-icon">` : `<img src="${icons[e.faction.toLowerCase()]}" class="fac-icon">`}</td>
                <td style="color:var(--text-dim)">${e.zone}</td>
                <td style="width:100px; text-align:center">${e.video ? `<a href="${e.video}" target="_blank" class="btn-video">WATCH</a>` : '—'}</td>
            `;
            body.appendChild(row);
        });
        updateRegionDropdown(factionPool);
    }

    function handleSearchInput() {
        const val = document.getElementById('searchInput').value;
        document.getElementById('clearSearch').style.display = val.length > 0 ? 'flex' : 'none';
        renderTable();
    }

    function clearSearch() {
        document.getElementById('searchInput').value = '';
        document.getElementById('clearSearch').style.display = 'none';
        renderTable();
    }

    function toggleDropdown(e, id) {
        e.stopPropagation();
        const list = document.getElementById(id);
        const isOpen = list.classList.contains('show');
        document.querySelectorAll('.options-list').forEach(l => l.classList.remove('show'));
        if (!isOpen) list.classList.add('show');
    }

    function selectClass(c) {
        currentClass = c;
        const dispText = document.getElementById('classDisplayText');
        const dispIcon = document.getElementById('classDisplayIcon');
        if (c === 'all') { dispText.innerText = 'All Classes'; dispIcon.style.display = 'none'; }
        else { dispText.innerText = c; dispIcon.src = `https://wow.zamimg.com/images/wow/icons/small/${classData[c]}.jpg`; dispIcon.style.display = 'inline-block'; }
        renderTable();
    }

    function selectRegion(r) {
        currentRegion = r;
        document.getElementById('regionDisplayText').innerText = r === 'all' ? 'All Regions' : r;
        renderTable();
    }

    function updateRegionDropdown(pool) {
        const container = document.getElementById('regionOptions');
        const zones = [...new Set(pool.map(e => e.zone))].sort();
        let html = `<div class="option-item" onclick="selectRegion('all')">All Regions</div>`;
        zones.forEach(z => {
            html += `<div class="option-item" onclick="selectRegion('${z}')">${z}</div>`;
        });
        container.innerHTML = html;
        if (currentRegion !== 'all' && !zones.includes(currentRegion)) {
            currentRegion = 'all';
            document.getElementById('regionDisplayText').innerText = 'All Regions';
        }
    }

    function setSort(key) {
        if (sortKey === key) sortOrder *= -1;
        else { sortKey = key; sortOrder = 1; }
        renderTable();
    }

    function updateSortIcons() {
        ['name', 'class', 'zone'].forEach(key => {
            const el = document.getElementById(`sort-${key}`);
            if (el) el.innerText = sortKey === key ? (sortOrder === 1 ? " ▲" : " ▼") : "";
        });
    }

    function setFaction(f) {
        currentFaction = f;
        document.querySelectorAll('.fac-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(f === 'Both' ? 'fac-both' : `fac-${f.toLowerCase()}`).classList.add('active');
        renderTable();
    }

    function toggleRE(name, shouldAdd) {
        if (shouldAdd) { if (!collectedNames.includes(name)) collectedNames.push(name); }
        else { collectedNames = collectedNames.filter(n => n !== name); }
        renderTable();
    }

    function updateProgress(pool) {
        const calc = (p) => {
            const uniq = [...new Set(p.map(e => e.name.toLowerCase()))];
            return [uniq.filter(n => collectedNames.includes(n)).length, uniq.length];
        };
        
        const [gD, gT] = calc(pool); 
        updateBar('global', gD, gT);
        
        // Update Class Bar + Dynamic Title
        const classTitle = currentClass === 'all' ? 'Class Progress' : `${currentClass} Progress`;
        document.getElementById('classProgressLabel').innerText = classTitle;
        const [cD, cT] = calc(pool.filter(e => currentClass === 'all' || e.class === currentClass)); 
        updateBar('class', cD, cT);
        
        // Update Region Bar + Dynamic Title
        const regionTitle = currentRegion === 'all' ? 'Region Progress' : `${currentRegion} Progress`;
        document.getElementById('regionProgressLabel').innerText = regionTitle;
        const [zD, zT] = calc(pool.filter(e => currentRegion === 'all' || e.zone === currentRegion)); 
        updateBar('region', zD, zT);
    }

    function updateBar(id, val, max) {
        const perc = max === 0 ? 0 : (val / max) * 100;
        document.getElementById(`${id}Fill`).style.width = `${perc}%`;
        document.getElementById(`${id}Text`).innerText = `${val}/${max}`;
    }

    function bulkAction(check) {
        const search = document.getElementById('searchInput').value.toLowerCase();
        enchants.forEach(e => {
            if ((currentFaction === "Both" || e.faction === "Both" || e.faction === currentFaction) && (currentClass === "all" || e.class === currentClass) && (currentRegion === "all" || e.zone === currentRegion) && (e.name.toLowerCase().includes(search) || e.zone.toLowerCase().includes(search))) {
                const name = e.name.toLowerCase();
                if (check && !collectedNames.includes(name)) collectedNames.push(name);
                else if (!check) collectedNames = collectedNames.filter(n => n !== name);
            }
        });
        renderTable();
    }

    function exportData() { localStorage.setItem('ascension_save_v1', JSON.stringify(collectedNames)); alert("Saved!"); }
    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { collectedNames = JSON.parse(e.target.result); renderTable(); };
        reader.readAsText(file);
    }

    function initClassOptions() {
        const container = document.getElementById('classOptions');
        let html = `<div class="option-item" onclick="selectClass('all')">All Classes</div>`;
        Object.keys(classData).sort().forEach(c => {
            html += `<div class="option-item" onclick="selectClass('${c}')"><img src="https://wow.zamimg.com/images/wow/icons/small/${classData[c]}.jpg" class="icon-class"> ${c}</div>`;
        });
        container.innerHTML = html;
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.options-list').forEach(l => l.classList.remove('show'));
    });

    initClassOptions();
    renderTable();
</script>
